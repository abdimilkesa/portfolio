<!doctype html>
<html lang="en">
  <head>
    <script>
      try {
        var savedTheme = localStorage.getItem('am-theme');
        var theme =
          savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (e) {}
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&family=Sora:wght@500;800&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <title>Abdi Milki | Aspiring AI Engineer &amp; Full-Stack Developer</title>
    <meta
      name="description"
      content="Abdi Milki is a Software Engineering student at Jimma University, Ethiopia: an aspiring AI Engineer and full-stack developer building intelligent digital experiences."
    />
    <meta name="author" content="Abdi Milki" />
    <meta name="theme-color" content="#FFFFFF" />
    <script>
      try {
        var activeTheme = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', activeTheme === 'dark' ? '#080D19' : '#FFFFFF');
      } catch (e) {}
    </script>
